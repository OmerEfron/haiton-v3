name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [backend, ai-reporter, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            ai-reporter/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: ai-reporter
      - run: npm ci
        working-directory: frontend
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: npm test
        working-directory: backend
      - run: npm test
        working-directory: ai-reporter
      - run: npm run test:int
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            ai-reporter/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: ai-reporter
      - run: npm ci
        working-directory: frontend
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  migrate:
    if: github.event_name != 'pull_request'
    needs: [check, integration, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db push --db-url "$DATABASE_URL" --yes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-api:
    if: github.event_name != 'pull_request'
    needs: migrate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [backend, ai-reporter]
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Repo root as build context: ai-reporter needs docs/ai-reporter/prompts.
      - run: flyctl deploy --remote-only --config ${{ matrix.dir }}/fly.toml --dockerfile ${{ matrix.dir }}/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-web:
    if: github.event_name != 'pull_request'
    needs: deploy-api
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      # Vercel builds remotely with the project env vars managed by terraform.
      - run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
        working-directory: frontend
